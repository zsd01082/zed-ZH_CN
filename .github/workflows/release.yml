# Zed 汉化版发布工作流（fork 适配版）
#
# 由官方 release.yml 精简改写，移除全部 zed-industries 私有基础设施依赖：
#   - 去掉 repository_owner 白名单限制
#   - 使用 GitHub 官方 runner（ubuntu-22.04 / windows-2022）替代私有 runner
#   - 去掉 Sentry / Slack / R2 sccache / Azure 签名 / Apple 公证 / 合规检查
#   - 产物均为未签名版（fork 分发无官方证书）
#   - 发布通道：仓库内 RELEASE_CHANNEL 保持 dev（本地开发可与正式版共存），
#     各 bundle job 检出后统一覆盖为 stable
#
# 触发方式：
#   - 推送 v* 标签
#   - 手动触发（workflow_dispatch）
#
# 版本号：与上游 zed-industries/zed 的 main 保持一致（scripts/sync-upstream-version.py）。
# verify_version job 在构建前校验，版本号落后于上游时直接失败，避免发布标签、
# Release 标题与二进制自报版本三者错位。
#
# 产物：macOS（Intel/x86_64）给 Zed-x86_64.dmg，附 zed-remote-server-macos-x86_64.gz。
#
# 注意：本文件不再由 `cargo xtask workflows` 生成，请勿运行该命令覆盖本文件。
name: release

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建 macOS x86_64 安装包，不创建 Release（验证流水线用）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_version:
    name: 校验版本号与上游一致
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验版本号（不落后于上游、与 Cargo.lock 一致、标签一致）
        run: |
          python3 scripts/sync-upstream-version.py --check-not-behind stable
          version="$(python3 scripts/sync-upstream-version.py --print)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 crates/zed/Cargo.toml 的版本号 ${version} 不一致，请对齐后重推标签。" >&2
            exit 1
          fi
          echo "发布版本号：${version}"

  bundle_macos_x86_64:
    name: 构建 macOS x86_64
    needs: verify_version
    # x86_64 版在 Apple Silicon runner 上交叉编译：script/bundle-mac 原生支持
    # x86_64-apple-darwin 目标（脚本内部 rustup target add + --target 构建），
    # 无需 Intel runner；打包同样要求 macOS SDK 26，故与 aarch64 共用 macos-26。
    runs-on: macos-26
    timeout-minutes: 360
    env:
      # 公共 runner 磁盘有限：去掉 release debuginfo（dSYM），避免构建中途磁盘耗尽
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置发布通道为 stable
        run: echo stable > crates/zed/RELEASE_CHANNEL

      # 上游要求 macOS SDK 26 才能打包（bundle-mac 会校验 SDKROOT），显式检查而不是
      # 假定 runner 自带：SDK 不是 26 及以上时直接失败，提示换用 macos-26。
      - name: 校验 Xcode 与 macOS SDK 版本
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          echo "macOS SDK: ${sdk_version} (${sdk_path})"
          if [ "${sdk_version%%.*}" -lt 26 ]; then
            echo "需要 macOS SDK 26 或更新，当前为 ${sdk_version}；请改用自带 Xcode 26 的 runner（macos-26）。" >&2
            exit 1
          fi

      # 公共 runner 磁盘有限：仅保留当前 Xcode（macos-26 镜像带 26.0～26.6 多份副本，
      # 每份十 GB 量级），删除其余副本与模拟器释放空间。删除逻辑以 xcode-select
      # 输出为准，保留的工具链含 metal，不会破坏后续编译。
      - name: 释放磁盘空间（仅保留当前 Xcode）
        run: |
          current="$(xcode-select -p | sed 's|/Contents/Developer$||')"
          echo "保留 Xcode: $current"
          for x in /Applications/Xcode*.app; do
            if [ "$x" != "$current" ]; then
              echo "删除: $x"
              sudo rm -rf "$x"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Caches/Homebrew 2>/dev/null || true
          sudo rm -rf /Users/runner/Library/Android /Users/runner/.gradle /Users/runner/.m2 2>/dev/null || true
          df -h /

      - name: 安装 Rust 工具链
        run: rustup show

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 cmake
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          else
            cmake --version | head -1
          fi

      # bundle-mac 内部用 npm 的 dmg-license 为 DMG 添加许可协议
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 打包 macOS x86_64（未签名）
        run: ./script/bundle-mac x86_64-apple-darwin

      - name: 上传 Zed-x86_64.dmg
        uses: actions/upload-artifact@v4
        with:
          name: Zed-x86_64.dmg
          path: target/x86_64-apple-darwin/release/Zed-x86_64.dmg
          if-no-files-found: error

      - name: 上传 zed-remote-server-macos-x86_64.gz
        uses: actions/upload-artifact@v4
        with:
          name: zed-remote-server-macos-x86_64.gz
          path: target/zed-remote-server-macos-x86_64.gz
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs:
      - verify_version
      - bundle_macos_x86_64
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本号与标签
        id: meta
        run: |
          version="$(script/get-crate-version zed)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # tag 触发使用标签名；手动触发使用 v{版本号}
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 整理产物
        run: |
          mkdir -p release-artifacts
          find ./artifacts -type f -exec mv {} release-artifacts/ \;
          ls -lR release-artifacts

      - name: 生成自动发布说明
        run: |
          # 调用 GitHub generate-notes，遵循 .github/release.yml 的分类配置
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body' > generated-notes.md 2>/dev/null; then
            echo "自动发布说明生成成功"
          else
            echo "自动生成失败，变更列表留空"
            : > generated-notes.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}

      - name: 组装发布说明（固定头部 + 自动列表）
        run: |
          {
            echo "> **Zed 汉化版** — 社区简体中文翻译构建，版本 v${VERSION}。"
            echo ">"
            echo "> ⚠️ **未签名说明**：本构建未经代码签名。"
            echo "> - macOS（Intel）：下载 \`Zed-x86_64.dmg\`，首次打开可能被 Gatekeeper 拦截，右键选择\"打开\"，或执行 \`xattr -dr com.apple.quarantine /Applications/Zed.app\`。"
            echo ""
            echo "---"
            echo ""
            echo "## 变更内容"
            echo ""
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              cat generated-notes.md
            fi
            if [ -s generated-notes.md ]; then
              echo ""
              echo "---"
              echo ""
              cat generated-notes.md
            fi
          } > release-body.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      # softprops 会自动创建或更新 Release 及对应标签
      - name: 创建/更新 Release 并上传资产
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Zed ${{ steps.meta.outputs.version }} (汉化版)
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          make_latest: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
